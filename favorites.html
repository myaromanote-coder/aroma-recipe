<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#E84393">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>즐겨찾기 - 아로마 레시피</title>
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icons/icon-192.svg">
  <link rel="stylesheet" href="css/style.css">
  <script src="js/auth.js"></script>
</head>
<body>

<!-- 상단 헤더 -->
<header class="top-header">
  <div class="header-inner">
    <a class="logo" href="index.html">
      <span class="logo-emoji">🌿</span>
      <span>아로마 레시피</span>
    </a>
    <div class="header-actions">
      <a class="icon-btn" href="index.html" title="검색">🔍</a>
      <a class="icon-btn" href="admin.html" id="adminBtn" title="관리자 설정" style="display:none">⚙️</a>
      <button class="icon-btn" title="로그아웃" onclick="if(confirm('로그아웃 하시겠어요?')){localStorage.removeItem('aroma_auth');localStorage.removeItem('aroma_role');location.reload();}">🔒</button>
    </div>
  </div>
</header>

<!-- 히어로 -->
<section class="page-hero">
  <h1>❤️ 즐겨찾기</h1>
  <p>저장한 레시피를 빠르게 찾아보세요</p>
</section>

<!-- 메인 -->
<main class="main">
  <div class="recipe-grid" id="favGrid">
    <div class="loading">
      <div class="spinner" style="border-top-color: #E84393;"></div>
      <p>불러오는 중...</p>
    </div>
  </div>
</main>

<!-- 하단 네비게이션 -->

<!-- 토스트 -->
<div class="toast" id="toast"></div>

<script src="js/recipes.js"></script>
<script src="js/db.js"></script>
<script src="js/favorites.js"></script>
<script>
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('./sw.js');
  if (localStorage.getItem('aroma_role') === 'admin') {
    document.getElementById('adminBtn').style.display = '';
  }
</script>
</body>
</html>
