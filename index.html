<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#7B6FA0">
  <meta name="description" content="아로마 레시피 검색 및 용량 자동 계산기">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="아로마">
  <title>아로마 레시피</title>
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icons/icon-192.svg">
  <link rel="stylesheet" href="css/style.css">
  <script src="js/auth.js"></script>
</head>
<body>

<!-- 상단 헤더 -->
<header class="top-header">
  <div class="header-inner">
    <a class="logo" href="index.html">
      <span class="logo-emoji">🌿</span>
      <span>아로마 레시피</span>
    </a>
    <div class="header-actions">
      <a class="icon-btn" href="favorites.html" title="즐겨찾기">
        ❤️
        <span class="fav-badge" id="favBadge"></span>
      </a>
      <a class="icon-btn" href="admin.html" id="adminBtn" title="관리자 설정" style="display:none">⚙️</a>
      <button class="icon-btn" id="logoutBtn" title="로그아웃" onclick="if(confirm('로그아웃 하시겠어요?')){localStorage.removeItem('aroma_auth');localStorage.removeItem('aroma_role');location.reload();}">🔒</button>
    </div>
  </div>
</header>

<!-- 히어로 + 검색 -->
<section class="hero">
  <p>원하는 오일이나 효능으로 레시피를 찾아보세요</p>
  <div class="search-wrap">
    <input class="search-input" id="searchInput" type="search" placeholder="라벤더, 수면, 스트레스 케어...">
    <button class="search-clear" id="searchClear" title="지우기">✕</button>
  </div>
</section>

<!-- 메인 콘텐츠 -->
<main class="main">
  <!-- 카테고리 필터 -->
  <div class="filter-bar" id="filterBar">
    <button class="chip active" data-cat="전체">전체</button>
    <button class="chip" data-cat="피부">✨ 피부</button>
    <button class="chip" data-cat="눈케어">👁️ 눈케어</button>
    <button class="chip" data-cat="통증">💪 통증</button>
    <span class="filter-break"></span>
    <button class="chip" data-cat="호흡기">💨 호흡기</button>
    <button class="chip" data-cat="수면">😴 수면</button>
    <button class="chip" data-cat="스트레스">🌸 스트레스</button>
    <button class="chip" data-cat="향수">🌺 향수</button>
    <span class="filter-break"></span>
    <button class="chip" data-cat="집중력">🧠 집중력</button>
    <button class="chip" data-cat="생활용품">🏠 생활용품</button>
    <button class="chip" data-cat="건강케어">💊 건강케어</button>
  </div>

  <!-- 결과 헤더 -->
  <div class="results-header">
    <span class="results-count" id="resultsCount"></span>
  </div>

  <!-- 레시피 그리드 -->
  <div class="recipe-grid" id="recipeGrid">
    <div class="loading">
      <div class="spinner"></div>
      <p>레시피를 불러오는 중...</p>
    </div>
  </div>
</main>

<!-- 하단 네비게이션 -->

<!-- 토스트 -->
<div class="toast" id="toast"></div>

<script src="js/recipes.js"></script>
<script src="js/db.js"></script>
<script src="js/main.js"></script>
<script>
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('./sw.js');
  if (localStorage.getItem('aroma_role') === 'admin') {
    document.getElementById('adminBtn').style.display = '';
  }
</script>
</body>
</html>
